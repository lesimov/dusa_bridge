<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dusa Debug Map</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2b3140;
    --txt: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --trace: #6e7681; --debug: #a371f7; --info: #3fb950; --warn: #d29922;
    --error: #f85149; --fatal: #ff7b72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 .dot { color: var(--accent); }
  header .grow { flex: 1; }
  .pill { font-size: 11px; color: var(--muted); background: var(--panel2); border: 1px solid var(--border);
          padding: 3px 8px; border-radius: 999px; }
  button, select, input {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 9px; font-size: 12px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb33; border-color: var(--accent); color: #cae3ff; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 51px); }
  aside { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 4px 0 10px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border);
             background: var(--panel); align-items: center; }
  .filters label { font-size: 11px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  .filters input[type=text] { min-width: 200px; }
  .tablewrap { overflow-y: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  th { position: sticky; top: 0; background: var(--panel2); text-align: left; padding: 6px 10px; color: var(--muted);
       font-weight: 600; border-bottom: 1px solid var(--border); }
  td { padding: 5px 10px; border-bottom: 1px solid #1a1f29; vertical-align: top; white-space: nowrap; }
  td.msg { white-space: normal; word-break: break-word; }
  tr:hover { background: #ffffff08; }
  tr.row-error td, tr.row-fatal td { background: #f8514912; }
  .lvl { font-weight: 700; }
  .lvl-TRACE { color: var(--trace); } .lvl-DEBUG { color: var(--debug); } .lvl-INFO { color: var(--info); }
  .lvl-WARN { color: var(--warn); } .lvl-ERROR { color: var(--error); } .lvl-FATAL { color: var(--fatal); }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--panel2);
         border: 1px solid var(--border); color: var(--muted); }
  .diag { color: #ffa657; font-weight: 600; cursor: pointer; }
  .side { font-size: 10px; color: var(--muted); }
  .data { color: var(--muted); }
  details.data summary { cursor: pointer; color: var(--accent); font-size: 11px; }
  details.data pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; color: var(--muted); }
  .prob {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px;
    background: var(--panel2); cursor: pointer; transition: border-color .12s;
  }
  .prob:hover { border-color: var(--accent); }
  .prob.zero { opacity: .55; }
  .prob .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .prob .code { font-family: ui-monospace, monospace; font-size: 12px; color: #ffa657; font-weight: 600; }
  .prob .cnt { font-size: 12px; font-weight: 700; }
  .prob .ttl { font-size: 12px; color: var(--txt); margin: 3px 0; }
  .prob .meta { font-size: 10px; color: var(--muted); display: flex; gap: 8px; }
  .prob .detail { margin-top: 7px; font-size: 11px; color: var(--muted); display: none; }
  .prob.open .detail { display: block; }
  .prob .detail b { color: var(--txt); font-weight: 600; }
  .prob .detail ul { margin: 3px 0 6px; padding-left: 16px; }
  .empty { color: var(--muted); font-size: 12px; padding: 20px; text-align: center; }
  .sev-ERROR { border-left: 3px solid var(--error); } .sev-FATAL { border-left: 3px solid var(--fatal); }
  .sev-WARN { border-left: 3px solid var(--warn); } .sev-INFO { border-left: 3px solid var(--info); }
  .sev-DEBUG { border-left: 3px solid var(--debug); }
</style>
</head>
<body>
<header>
  <h1><span class="dot">●</span> Dusa Debug Map</h1>
  <span class="pill" id="status">connecting…</span>
  <span class="pill" id="catsrc"></span>
  <span class="grow"></span>
  <label class="pill" style="cursor:pointer"><input type="checkbox" id="auto" checked style="vertical-align:-1px"> live</label>
  <button id="copyBtn">Copy report</button>
  <button id="dlBtn">Download .json</button>
  <button id="clearBtn">Clear</button>
</header>

<div class="layout">
  <aside>
    <h2>Active Problems</h2>
    <div id="problems"><div class="empty">loading…</div></div>
  </aside>
  <main>
    <div class="filters">
      <label>Level
        <select id="fLevel">
          <option value="">all</option>
          <option value="1">TRACE+</option>
          <option value="2">DEBUG+</option>
          <option value="3">INFO+</option>
          <option value="4">WARN+</option>
          <option value="5">ERROR+</option>
          <option value="6">FATAL</option>
        </select>
      </label>
      <label>Category <select id="fCat"><option value="">all</option></select></label>
      <label>Diag code <select id="fDiag"><option value="">all</option></select></label>
      <label>Side
        <select id="fSide">
          <option value="">all</option>
          <option value="server">server</option>
          <option value="client">client</option>
        </select>
      </label>
      <label>Search <input type="text" id="fQ" placeholder="message / data / code…"></label>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="tablewrap" id="tablewrap">
      <table>
        <thead><tr>
          <th style="width:70px">time</th><th style="width:58px">level</th><th style="width:90px">category</th>
          <th style="width:48px">side</th><th style="width:150px">diag code</th><th>message</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="emptyRows">No logs yet. Trigger an action in-game.</div>
    </div>
  </main>
</div>

<script>
(function () {
  // API base derived from current path so trailing slash & any IP/port work.
  const API = location.pathname.replace(/\/+$/, '') + '/api';
  const token = new URLSearchParams(location.search).get('token') || '';
  const tok = token ? ('&token=' + encodeURIComponent(token)) : '';
  const tokq = token ? ('?token=' + encodeURIComponent(token)) : '';

  let sinceSeq = 0;
  let rowsBuf = [];            // newest first
  let lastGen = null;          // server buffer generation; changes on clear/producer restart
  const MAX_ROWS = 3000;
  const catsSeen = new Set();
  const diagSeen = new Set();
  const LEVEL_NAMES = { 1:'TRACE',2:'DEBUG',3:'INFO',4:'WARN',5:'ERROR',6:'FATAL' };

  const $ = id => document.getElementById(id);
  const f = { level: $('fLevel'), cat: $('fCat'), diag: $('fDiag'), side: $('fSide'), q: $('fQ') };

  function filterQS() {
    const p = new URLSearchParams();
    p.set('since', sinceSeq);
    if (f.level.value) p.set('level', f.level.value);
    if (f.cat.value) p.set('category', f.cat.value);
    if (f.diag.value) p.set('diag', f.diag.value);
    if (f.side.value) p.set('side', f.side.value);
    if (f.q.value.trim()) p.set('q', f.q.value.trim());
    return p.toString() + tok;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  }

  function addDropdownOption(sel, set, value) {
    if (!value || set.has(value)) return;
    set.add(value);
    const o = document.createElement('option');
    o.value = value; o.textContent = value;
    sel.appendChild(o);
  }

  function resetDropdown(sel, set) {
    set.clear();
    while (sel.options.length > 1) sel.remove(1); // keep the leading "all" option
  }

  function rowHtml(e) {
    const lvl = LEVEL_NAMES[e.level] || e.levelName || '?';
    const cls = (lvl === 'ERROR' || lvl === 'FATAL') ? ('row-' + lvl.toLowerCase()) : '';
    let dataCell = '';
    if (e.data) {
      let pretty = e.data;
      try { pretty = JSON.stringify(JSON.parse(e.data), null, 2); } catch (_) {}
      dataCell = `<details class="data"><summary>data</summary><pre>${esc(pretty)}</pre></details>`;
    }
    const diag = e.diagCode ? `<span class="diag" data-diag="${esc(e.diagCode)}">${esc(e.diagCode)}</span>` : '';
    return `<tr class="${cls}">
      <td>${esc(e.timestamp || e.recvStamp || '')}</td>
      <td class="lvl lvl-${lvl}">${lvl}</td>
      <td><span class="tag">${esc(e.category || '')}</span></td>
      <td class="side">${esc(e.side || '')}</td>
      <td>${diag}</td>
      <td class="msg">${esc(e.message || '')}${dataCell}</td>
    </tr>`;
  }

  function render() {
    $('rows').innerHTML = rowsBuf.map(rowHtml).join('');
    $('emptyRows').style.display = rowsBuf.length ? 'none' : 'block';
    document.querySelectorAll('.diag').forEach(el => {
      el.onclick = () => { f.diag.value = el.dataset.diag; resetStream(); poll(); };
    });
  }

  function resetStream() { sinceSeq = 0; rowsBuf = []; }

  async function poll() {
    try {
      const r = await fetch(`${API}/logs?${filterQS()}`, { cache: 'no-store' });
      const j = await r.json();
      if (!j.ok) return;

      // Session boundary: the buffer was cleared (manual clear OR the debugged
      // script restarted -> gen bumped), or dusa_bridge itself restarted
      // (seq went backwards). Drop stale rows and re-sync from 0 next cycle so
      // only the CURRENT session is ever shown.
      const cleared   = (j.gen !== undefined && lastGen !== null && j.gen !== lastGen);
      const restarted = (typeof j.seq === 'number' && j.seq < sinceSeq);
      if (cleared || restarted) {
        rowsBuf = [];
        resetDropdown(f.cat, catsSeen);
        resetDropdown(f.diag, diagSeen);
        sinceSeq = 0;
        lastGen = j.gen;
        render();
        $('status').textContent = `${j.total} entries · seq ${j.seq}`;
        return; // next poll re-fetches from seq 0
      }
      lastGen = j.gen;

      if (j.logs && j.logs.length) {
        // server returns oldest->newest; prepend reversed so newest is on top
        for (let i = j.logs.length - 1; i >= 0; i--) {
          const e = j.logs[i];
          rowsBuf.unshift(e);
          addDropdownOption(f.cat, catsSeen, (e.category || '').toUpperCase());
          addDropdownOption(f.diag, diagSeen, e.diagCode);
        }
        if (rowsBuf.length > MAX_ROWS) rowsBuf.length = MAX_ROWS;
        render();
      }
      sinceSeq = j.seq || sinceSeq;
      $('status').textContent = `${j.total} entries · seq ${j.seq}`;
    } catch (err) {
      $('status').textContent = 'no connection';
    }
  }

  async function pollProblems() {
    try {
      const r = await fetch(`${API}/problems${tokq}`, { cache: 'no-store' });
      const j = await r.json();
      if (!j.ok) return;
      $('catsrc').textContent = 'catalog: ' + (j.source || '?');
      const sorted = (j.problems || []).sort((a, b) => (b.count - a.count) || a.code.localeCompare(b.code));
      const box = $('problems');
      if (!sorted.length) { box.innerHTML = '<div class="empty">catalog empty</div>'; return; }
      box.innerHTML = sorted.map(p => {
        const sev = p.severity ? ('sev-' + p.severity) : '';
        const causes = (p.causes || []).map(c => `<li>${esc(c)}</li>`).join('');
        const rem = (p.remediation || []).map(c => `<li>${esc(c)}</li>`).join('');
        return `<div class="prob ${sev} ${p.count ? '' : 'zero'}" data-code="${esc(p.code)}">
          <div class="top"><span class="code">${esc(p.code)}</span><span class="cnt">${p.count || 0}</span></div>
          <div class="ttl">${esc(p.title || '')}</div>
          <div class="meta"><span>${esc(p.category || '')}</span>${p.lastSeen ? '<span>last: ' + esc(p.lastSeen) + '</span>' : ''}${p.catalogued ? '' : '<span>uncatalogued</span>'}</div>
          <div class="detail">${causes ? '<b>Likely cause</b><ul>' + causes + '</ul>' : ''}${rem ? '<b>Remediation</b><ul>' + rem + '</ul>' : ''}</div>
        </div>`;
      }).join('');
      box.querySelectorAll('.prob').forEach(el => {
        el.onclick = (ev) => {
          if (ev.target.closest('.detail')) return;
          // toggle detail; double-purpose: also filter the stream by this code
          el.classList.toggle('open');
          f.diag.value = el.dataset.code;
          resetStream(); poll();
        };
      });
    } catch (_) {}
  }

  async function fetchReport() {
    const r = await fetch(`${API}/report${tokq}`, { cache: 'no-store' });
    return await r.json();
  }

  // --- Controls ---
  Object.values(f).forEach(el => el.addEventListener('change', () => { resetStream(); poll(); }));
  f.q.addEventListener('input', () => { clearTimeout(window.__qt); window.__qt = setTimeout(() => { resetStream(); poll(); }, 300); });

  $('resetBtn').onclick = () => {
    f.level.value = ''; f.cat.value = ''; f.diag.value = ''; f.side.value = ''; f.q.value = '';
    resetStream(); poll();
  };
  $('clearBtn').onclick = async () => {
    if (!confirm('Clear the buffer?')) return;
    await fetch(`${API}/clear${tokq}`, { cache: 'no-store' });
    resetStream(); render(); pollProblems();
  };
  $('copyBtn').onclick = async () => {
    const rep = await fetchReport();
    await navigator.clipboard.writeText(JSON.stringify(rep, null, 2));
    $('copyBtn').textContent = 'copied ✓';
    setTimeout(() => $('copyBtn').textContent = 'Copy report', 1500);
  };
  $('dlBtn').onclick = async () => {
    const rep = await fetchReport();
    const blob = new Blob([JSON.stringify(rep, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dusa-debug-report-' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  // --- Loop ---
  function tick() {
    if ($('auto').checked) poll();
  }
  poll();
  pollProblems();
  setInterval(tick, 1500);
  setInterval(pollProblems, 4000);
})();
</script>
</body>
</html>
